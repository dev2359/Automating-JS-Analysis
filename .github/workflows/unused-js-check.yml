name: Unused JS Analysis with OpenAI and Slack

on:
  schedule:
    # 매일 아침 9시 (KST 기준 00:00 UTC) 실행 예시
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 별도 실행

env:
  # 2026-06-02 부터 강제 적용 예정인 Node 24 러너에 미리 옵트인.
  # actions/checkout 및 actions/setup-node 가 Node 24 환경에서 실행된다.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze-and-report:
    runs-on: ubuntu-latest
    # history/ 디렉토리에 매일 snapshot 을 자동 commit 하려면 contents:write 필요
    permissions:
      contents: write
    steps:
      - name: 📦 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🟢 Node.js 20 셋업
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📁 패키지 설치
        run: npm install

      - name: 🎭 Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 🚀 1단계 - JS 커버리지 측정 (E2E)
        run: npx playwright test tests/full-flow-coverage.spec.ts --project=chromium

      - name: 🤖 2단계 - OpenAI 미사용 분석
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node analyze-js.js

      # OpenAI 분석이 생성한 오늘 snapshot (history/YYYY-MM-DD.json) 을 main 에 자동 commit.
      # 시계열 누적 데이터로, 다음 실행 시 7일 전 비교에 사용된다.
      - name: 📅 history snapshot 자동 commit
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ history 변경 없음 (스킵)"
          else
            git commit -m "chore: archive coverage history $(date -u +%Y-%m-%d) [skip ci]"
            git push origin HEAD:main
            echo "✅ history snapshot 커밋·푸시 완료"
          fi

      # Slack 실패 여부와 무관하게 결과 텍스트/JSON 을 항상 아티팩트로 업로드.
      # 워크플로 실행 페이지의 "Artifacts" 섹션에서 다운로드할 수 있다.
      - name: 📤 분석 결과 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-analysis
          path: |
            coverage-results/
            ai-analysis-results/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: 💬 3단계 - Slack 결과 전송
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node send-slack.js
